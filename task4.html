        body {
            font-family: Arial, sans-serif;
            /* Cool modern dark-slate background */
            background-color: #222831; 
            margin: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        /* Clean modern card layout */
        .user-card {
            background-color: #0beb95; /* Charcoal gray card */
            border: 1px solid #4f5660;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.3);
            text-align: center;
            color: #eeeeee; /* Off-white text color */
        }

        /* Profile image with a cool glowing border */
        .user-logo {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background-color: #ffffff;
            border: 3px solid #00adb5; /* Electric teal accent color */
            box-shadow: 0 0 8px rgba(0, 173, 181, 0.5);
        }

        /* Name header styling */
        h3 {
            margin: 10px 0 5px 0;
            color: #ffffff;
            font-size: 20px;
        }

        /* Job text styling */
        p {
            margin: 0 0 15px 0;
            color: #18191a; /* Highlighting job titles with cool teal */
            font-weight: bold;
            font-size: 14px;
        }

        /* Table inside the card */
        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
            background-color: #222831; /* Darker interior table background */
            border-radius: 8px;
            overflow: hidden;
        }

        td {
            border: 1px solid #393E46;
            padding: 10px;
            text-align: left;
            font-size: 13px;
            color: #cccccc;
        }

        /* Left column formatting (Labels) */
        td:first-child {
            font-weight: bold;
            color: #00adb5; /* Cool teal labels */
            background-color: #2d323b; 
            width: 35%;
        }
    </style>
</head>
